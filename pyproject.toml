[project]
name = "crypto-strategy-lab"
version = "0.1.0"
description = "Event-driven crypto strategy research and backtesting toolkit."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Crypto Strategy Lab" }]
dependencies = [
    "cryptography>=42,<47",
    "defusedxml>=0.7,<1",
    "eth-abi>=5,<6",
    "eth-hash[pycryptodome]>=0.7,<1",
    "eth-utils>=5,<6",
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.scripts]
crypto-lab = "crypto_strategy_lab.cli:main"
crypto-lab-web = "crypto_strategy_lab.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_strategy_lab = ["static/*"]
